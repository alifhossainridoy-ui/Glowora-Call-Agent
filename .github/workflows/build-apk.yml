name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare buildozer.spec at repo root
        run: cp app/buildozer.spec buildozer.spec

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache project .buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK (official kivy/buildozer Docker image)
        run: |
          set -o pipefail
          mkdir -p .buildozer_global
          yes | docker run --rm -i \
            -v "$PWD":/home/user/hostcwd \
            -v "$PWD/.buildozer_global":/home/user/.buildozer \
            kivy/buildozer android debug 2>&1 | tee buildozer_output.log

      - name: Save failure log to repo (for offline diagnosis)
        if: failure()
        run: |
          mkdir -p ci-logs
          tail -n 400 buildozer_output.log > ci-logs/last_failure.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add ci-logs/last_failure.log
          git commit -m "ci: save failure log from run ${{ github.run_id }}" || exit 0
          git push origin main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-cosmetics-ai-debug-apk
          path: bin/*.apk
