name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare buildozer.spec at repo root
        run: cp app/buildozer.spec buildozer.spec

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git unzip zip \
            python3-pip python3-venv \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            openjdk-17-jdk

      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 Cython==3.0.5 "python-for-android==2024.1.21"

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache project .buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee buildozer_output.log

      - name: Save failure log to repo (for offline diagnosis)
        if: failure()
        run: |
          mkdir -p ci-logs
          tail -n 400 buildozer_output.log > ci-logs/last_failure.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add ci-logs/last_failure.log
          git commit -m "ci: save failure log from run ${{ github.run_id }}" || exit 0
          git push origin main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-cosmetics-ai-debug-apk
          path: bin/*.apk
